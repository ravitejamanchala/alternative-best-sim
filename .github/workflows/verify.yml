name: Verify World development
on:
  push:
    branches: ['development/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test && npm run build && npm run build:adapter && npm run api:check
      - run: npx playwright install --with-deps chromium
      - name: Start isolated local editor
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/slaydrive-world-vite.log 2>&1 &
          echo "CHROMIUM_PATH=$(node --input-type=module -e 'import {chromium} from "playwright"; process.stdout.write(chromium.executablePath())')" >> "$GITHUB_ENV"
          node --input-type=module -e 'for(let i=0;i<40;i++){try{if((await fetch("http://127.0.0.1:5173")).ok)process.exit(0);}catch{}await new Promise(r=>setTimeout(r,250));}process.exit(1)'
      - run: npm run test:browser && npm run test:physics && npm run test:interaction && npm run bench
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-verification
          path: test-results/
